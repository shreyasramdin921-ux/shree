name: Push Trigger Workflow

on:
  push:
    branches:
      - main

jobs:
  push-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Display date
        run: date
